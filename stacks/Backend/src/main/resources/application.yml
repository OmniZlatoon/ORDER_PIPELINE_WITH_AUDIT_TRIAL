server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/order_pipeline?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:order_app}
    password: ${DB_PASSWORD:order_app}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

app:
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  payment:
    simulate-failure: ${SIMULATE_PAYMENT_FAILURE:false}
